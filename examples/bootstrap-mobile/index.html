<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap 5 Mobile-First App UI</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    >
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >
    <link rel="stylesheet" href="./bootstrap-mobile.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header d-flex align-items-center justify-content-between">
        <div>
          <h1 class="hero-title">Dashboard</h1>
          <p class="hero-subtitle">Mobile-first Bootstrap 5 layout.</p>
        </div>
        <button class="btn btn-outline-secondary rounded-pill px-3">Profile</button>
      </header>

      <section class="surface-card card mb-3">
        <div class="card-body">
          <h2 class="section-title">Quick actions</h2>
          <div class="quick-actions">
            <button class="btn btn-primary">New task</button>
            <button class="btn btn-light border">Calendar</button>
            <button class="btn btn-light border">Messages</button>
            <button class="btn btn-light border">Reports</button>
          </div>
        </div>
      </section>

      <section class="surface-card card mb-3">
        <div class="card-body">
          <h2 class="section-title">Upcoming tasks</h2>
          <ul class="list-group list-group-flush">
            <li class="list-group-item px-0">Prepare sprint review</li>
            <li class="list-group-item px-0">Send invoices</li>
            <li class="list-group-item px-0">Update roadmap</li>
          </ul>
        </div>
      </section>

      <section class="surface-card card">
        <div class="card-body">
          <h2 class="section-title">Add reminder</h2>
          <form class="row g-2">
            <div class="col-12">
              <input class="form-control" type="text" placeholder="Reminder title">
            </div>
            <div class="col-12 col-sm-6">
              <input class="form-control" type="date">
            </div>
            <div class="col-12 col-sm-6">
              <select class="form-select">
                <option>Priority: Low</option>
                <option selected>Priority: Medium</option>
                <option>Priority: High</option>
              </select>
            </div>
            <div class="col-12">
              <button class="btn btn-primary w-100">Save reminder</button>
            </div>
          </form>
        </div>
      </section>
    </main>

    <nav class="bottom-nav">
      <div class="container-fluid">
        <ul class="nav justify-content-around">
          <li class="nav-item">
            <a class="nav-link active" href="#">
              <i class="bi bi-house"></i>
              Home
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">
              <i class="bi bi-list-check"></i>
              Tasks
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">
              <i class="bi bi-chat-left-text"></i>
              Inbox
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">
              <i class="bi bi-gear"></i>
              Settings
            </a>
          </li>
        </ul>
      </div>
    </nav>
  </body>
</html>
